name: Release chart

# Publishes charts/gshare to the gh-pages Helm repository.
#
# Manual only. The automatic push trigger is off because this repository has no `gh-pages`
# branch to publish into, so every chart change failed the run for nothing. gShare is installed
# by cloning the repository and pointing Helm at charts/gshare, not from a chart repository.
#
# To turn the automatic publish back on: create an empty `gh-pages` branch, point GitHub Pages at
# it, bump `version` in charts/gshare/Chart.yaml on every chart change, and restore the trigger:
#
#   push:
#     branches: [main]
#     paths:
#       - charts/**
#       - .github/workflows/chart-release.yml
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart-release:
    runs-on: ubuntu-latest
    if: github.repository == 'boanlab/gShare'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - uses: helm/chart-releaser-action@v1.8.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_SKIP_EXISTING: "true"
