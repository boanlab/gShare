{{- if .Values.controlPlane.enabled }}
# gshare-api — the Python FastAPI control plane. It is the authority that issues every identifier,
# publishes the JWKS, applies GShareSession custom resources, and serves the connect-verify auth-url.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gshare-api
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
    app.kubernetes.io/name: gshare-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "gshare.selectorLabels" (dict "component" "gshare-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gshare.labels" . | nindent 8 }}
        {{- include "gshare.selectorLabels" (dict "component" "gshare-api") | nindent 8 }}
      annotations:
        # Roll the pods whenever the ConfigMap changes; a Deployment whose template is untouched
        # would otherwise keep serving the old environment after `helm upgrade`.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # GET /metrics is served by the pod but NOT routed by the ingress; Prometheus scrapes
        # the pod directly through these annotations.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.port | quote }}
        prometheus.io/path: /metrics
    spec:
      {{- include "gshare.controlPlaneNodeSelector" . | nindent 6 }}
      serviceAccountName: {{ .Values.serviceAccounts.controller }}
      {{- include "gshare.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "gshare.podSecurityContext" . | nindent 8 }}
      # Run alembic upgrade head before the api starts; the app then seeds the bootstrap administrator.
      initContainers:
        - name: migrate
          image: {{ include "gshare.image" (dict "img" .Values.images.api "root" $) }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["sh", "-c", "alembic upgrade head"]
          envFrom:
            - configMapRef: { name: gshare-config }
          env:
            - name: GSHARE_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.credentialsSecret }}, key: uri } }
      containers:
        - name: api
          image: {{ include "gshare.image" (dict "img" .Values.images.api "root" $) }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          securityContext:
            {{- include "gshare.containerSecurityContext" . | nindent 12 }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}", "--proxy-headers", "--forwarded-allow-ips=*"]
          ports:
            - { name: http, containerPort: {{ .Values.api.port }} }
          envFrom:
            - configMapRef: { name: gshare-config }
          env:
            # Secrets from external-secrets. The app reads only GSHARE_-prefixed variables
            # (pydantic env_prefix).
            - name: GSHARE_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.credentialsSecret }}, key: uri } }
            # HS256 signing key for user tokens; the api refuses to start without it.
            - name: GSHARE_USER_JWT_SECRET
              valueFrom: { secretKeyRef: { name: gshare-auth-token, key: secret } }
            # RS256 private key for the internal JWT. The api is the only signer; everyone else
            # verifies against the JWKS.
            - name: GSHARE_INTERNAL_JWT_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: gshare-jwt-signing, key: private.pem } }
            - name: GSHARE_INTERNAL_JWT_KID
              valueFrom: { secretKeyRef: { name: gshare-jwt-signing, key: active_kid } }
            # Initial password for the bootstrap super_admin, whose account is ensured at startup.
            # The email and display name come from the ConfigMap.
            - name: GSHARE_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: gshare-bootstrap-admin, key: password } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- include "gshare.controllerTokenVolumeMount" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "gshare.controllerTokenVolume" . | nindent 8 }}

{{- end }}
