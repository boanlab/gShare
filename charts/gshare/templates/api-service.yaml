{{- if .Values.controlPlane.enabled }}
# Service for gshare-api: the console's REST API plus the internal plane — the connect-verify
# auth-url, status callbacks, and the JWKS. One uvicorn serves the public and internal routes on the
# same HTTP port. The frontend nginx does not proxy /internal/*, so it never reaches the public
# ingress and stays cluster-internal.
# auth-url = http://api.gshare-system/internal/connect/verify
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
    app.kubernetes.io/name: gshare-api
spec:
  selector:
    {{- include "gshare.selectorLabels" (dict "component" "gshare-api") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Upstream alias the frontend nginx expects. The image's nginx.conf does
# `proxy_pass http://gshare-api:8080`, so this service exposes the api on that name and port.
apiVersion: v1
kind: Service
metadata:
  name: gshare-api
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
    app.kubernetes.io/name: gshare-api
spec:
  selector:
    {{- include "gshare.selectorLabels" (dict "component" "gshare-api") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }

{{- end }}
