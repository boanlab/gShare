{{- if .Values.controlPlane.enabled }}
# Shared configuration: the non-secret runtime settings. Secrets come from external-secrets; see
# deploy/secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gshare-config
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
data:
  # Session connect URLs are {scheme}://{console domain}/proxy/{cr}/..., path-based and matching the
  # operator's --session-domain. SESSION_DOMAIN is the console domain. The app reads only
  # GSHARE_-prefixed variables (pydantic env_prefix).
  GSHARE_SESSION_DOMAIN: {{ .Values.global.domains.console | quote }}
  # http is for deployments without a TLS-terminating proxy in front (labs, air-gapped sites).
  GSHARE_SESSION_URL_SCHEME: {{ .Values.global.sessionUrlScheme | default "https" | quote }}
  # Redis connection, derived from values.redis. Shared by api and worker for the queue, locks,
  # connect tokens, and idempotency.
  GSHARE_REDIS_URL: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}/0"
  # Per-process SQLAlchemy pool. Size for request-scoped work only — SSE streams do not hold a
  # pooled connection. Postgres max_connections must cover (api.replicas + worker.replicas) ×
  # (poolSize + maxOverflow) with headroom.
  GSHARE_DB_POOL_SIZE: {{ .Values.api.dbPoolSize | default 20 | quote }}
  # Audit-log retention in days; 0 keeps everything.
  GSHARE_AUDIT_RETENTION_DAYS: {{ .Values.api.auditRetentionDays | default 180 | quote }}
  # Console image builds: registry prefix kaniko pushes to; the final ref is
  # {prefix}/{user_id}/{name}:{tag}. Point at the local registry in plain-HTTP labs.
  GSHARE_BUILD_REGISTRY: {{ .Values.api.buildRegistry | default "registry.gshare.internal/gshare-user" | quote }}
  {{- /* not `default`: 0 is a legitimate value (reclaim on the next sync) and `default` would swallow it */}}
  GSHARE_VOLUME_RECLAIM_GRACE_HOURS: {{ ternary .Values.api.volumeReclaimGraceHours 24 (hasKey .Values.api "volumeReclaimGraceHours") | quote }}
  GSHARE_DB_MAX_OVERFLOW: {{ .Values.api.dbMaxOverflow | default 10 | quote }}
  # JWKS used to verify the internal RS256 JWT. The api fetches it from itself when verifying an
  # operator callback. The default (api.gshare.internal) does not resolve inside the cluster, so it
  # must be overridden with the in-cluster service URL.
  GSHARE_INTERNAL_JWKS_URL: "http://api.{{ .Values.global.namespaces.system }}.svc.cluster.local/.well-known/gshare-internal-jwks.json"
  # The bootstrap super_admin. Its password lives in the gshare-bootstrap-admin secret, mounted by
  # the api deployment.
  GSHARE_BOOTSTRAP_ADMIN_EMAIL: {{ .Values.bootstrapAdmin.email | quote }}
  # Automatic registration of the local cluster in an all-in-one install. The id must equal
  # operator.clusterId, or the inventory foreign keys will not line up.
  GSHARE_BOOTSTRAP_LOCAL_CLUSTER: {{ .Values.bootstrapLocalCluster | quote }}
  GSHARE_LOCAL_CLUSTER_ID: {{ .Values.operator.clusterId | quote }}
  # Fractional borrowing. Toggle it together with operator.hamiYieldExtender; only the HAMi extender
  # path can borrow fractionally.
  GSHARE_YIELD_FRACTIONAL_BORROW: {{ .Values.operator.hamiYieldExtender | quote }}
  # Per-card GPU pools: must match the operator's --per-card-mode (both read operator.perCardMode).
  GSHARE_PER_CARD_MODE: {{ .Values.operator.perCardMode | quote }}

{{- end }}
