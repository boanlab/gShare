{{- /*
The default in-cluster data tier: single instances, for development and all-in-one installs.
Production uses external CloudNativePG and Redis, so set postgres.inCluster and redis.inCluster to
false, which disables this template entirely.
The Postgres password is read from the gshare-pg-app secret, created and preserved by secrets.yaml.
*/}}
{{- if .Values.postgres.inCluster }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gshare-pg-data
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gshare-pg
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
    app.kubernetes.io/name: gshare-pg
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "gshare.selectorLabels" (dict "component" "gshare-pg") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gshare.labels" . | nindent 8 }}
        {{- include "gshare.selectorLabels" (dict "component" "gshare-pg") | nindent 8 }}
    spec:
      {{- include "gshare.controlPlaneNodeSelector" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.credentialsSecret }}, key: password } }
          ports:
            - { containerPort: 5432, name: postgres }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgres.database | quote }}] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gshare-pg-data }
---
apiVersion: v1
kind: Service
metadata:
  name: gshare-pg-rw
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "gshare.selectorLabels" (dict "component" "gshare-pg") | nindent 4 }}
  ports:
    - { port: 5432, targetPort: postgres }
{{- end }}
{{- if .Values.redis.inCluster }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gshare-redis
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
    app.kubernetes.io/name: gshare-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "gshare.selectorLabels" (dict "component" "gshare-redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gshare.labels" . | nindent 8 }}
        {{- include "gshare.selectorLabels" (dict "component" "gshare-redis") | nindent 8 }}
    spec:
      {{- include "gshare.controlPlaneNodeSelector" . | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - { containerPort: 6379, name: redis }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gshare-redis
  namespace: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "gshare.selectorLabels" (dict "component" "gshare-redis") | nindent 4 }}
  ports:
    - { port: 6379, targetPort: redis }
{{- end }}
