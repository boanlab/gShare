{{- /*
Generates the secrets for development and self-contained installs (secrets.generate=true). In
production external-secrets injects them, so set it to false.

Existing values are preserved with `lookup`, so an upgrade does not regenerate them and break tokens
or the database. Rotating the RS256 key or the database password is a deliberate operational step.

Values are base64-encoded into `data`; results from `lookup` already are.
*/}}
{{- if .Values.secrets.generate }}
{{- $ns := .Values.global.namespaces.system }}
{{- /* 1. HS256 signing key for user tokens */}}
{{- $auth := (lookup "v1" "Secret" $ns "gshare-auth-token") }}
{{- $authSecret := "" }}
{{- if $auth }}{{- $authSecret = (index $auth.data "secret") }}{{- else }}{{- $authSecret = (randAlphaNum 48 | b64enc) }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: gshare-auth-token
  namespace: {{ $ns }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
type: Opaque
data:
  secret: {{ $authSecret | quote }}
---
{{- /* 2. RS256 signing key and kid for the internal plane */}}
{{- $jwt := (lookup "v1" "Secret" $ns "gshare-jwt-signing") }}
{{- $pem := "" }}
{{- $kid := "" }}
{{- if $jwt }}
{{- $pem = (index $jwt.data "private.pem") }}
{{- $kid = (index $jwt.data "active_kid") }}
{{- else }}
{{- $pem = (genPrivateKey "rsa" | b64enc) }}
{{- $kid = (printf "k%s" (randAlphaNum 8 | lower) | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: gshare-jwt-signing
  namespace: {{ $ns }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
type: Opaque
data:
  private.pem: {{ $pem | quote }}
  active_kid: {{ $kid | quote }}
---
{{- /* 3. Initial password for the bootstrap super_admin.
       An existing secret is preserved; failing that, values' bootstrapAdmin.password is used; failing
       that, an 18-character random string. Setting it explicitly is safe, because the user is forced
       to change it at first login. */}}
{{- $adm := (lookup "v1" "Secret" $ns "gshare-bootstrap-admin") }}
{{- $admPw := "" }}
{{- if $adm }}{{- $admPw = (index $adm.data "password") }}
{{- else if .Values.bootstrapAdmin.password }}{{- $admPw = (.Values.bootstrapAdmin.password | b64enc) }}
{{- else }}{{- $admPw = (randAlphaNum 18 | b64enc) }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: gshare-bootstrap-admin
  namespace: {{ $ns }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $admPw | quote }}
{{- if .Values.postgres.inCluster }}
---
{{- /* 4. Credentials for the in-cluster Postgres: a uri for the app and a password for the Postgres
       container, sharing the same password. */}}
{{- $pg := (lookup "v1" "Secret" $ns .Values.postgres.credentialsSecret) }}
{{- $pgUri := "" }}
{{- $pgPw := "" }}
{{- if $pg }}
{{- $pgUri = (index $pg.data "uri") }}
{{- $pgPw = (index $pg.data "password") }}
{{- else }}
{{- $raw := (randAlphaNum 24) }}
{{- $pgPw = ($raw | b64enc) }}
{{- $pgUri = (printf "postgresql+asyncpg://%s:%s@%s:%d/%s" .Values.postgres.database $raw .Values.postgres.host (int .Values.postgres.port) .Values.postgres.database | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.credentialsSecret }}
  namespace: {{ $ns }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
type: Opaque
data:
  uri: {{ $pgUri | quote }}
  password: {{ $pgPw | quote }}
{{- end }}
{{- end }}
