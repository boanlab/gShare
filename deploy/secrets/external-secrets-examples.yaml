# external-secrets: syncing from a Vault or KMS backend into Kubernetes Secrets.
# No plaintext Secret manifest ever lives in git or in an image; the operator pulls them from the
# external store.
# apiVersion: external-secrets.io/v1beta1 (ESO).
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gshare-vault
  namespace: gshare-system
spec:
  provider:
    vault:
      server: "https://vault.gshare.internal:8200"
      path: "gshare"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "gshare-system"
          serviceAccountRef:
            name: gshare-eso
---
# 1. Internal JWT signing key (RS256). Only the api holds the private key; everyone verifies against
#    the public JWKS. Rotate every 90 days.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gshare-jwt-signing
  namespace: gshare-system
spec:
  refreshInterval: "1h"
  secretStoreRef: { name: gshare-vault, kind: SecretStore }
  target: { name: gshare-jwt-signing, creationPolicy: Owner }
  data:
    - secretKey: private.pem
      remoteRef: { key: jwt/internal, property: active_private_pem }
    - secretKey: active_kid
      remoteRef: { key: jwt/internal, property: active_kid }
---
# 1b. HS256 signing key for user tokens, read by the api as GSHARE_USER_JWT_SECRET. Without it the
#     api refuses to start. Rotate every 30 days.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gshare-auth-token
  namespace: gshare-system
spec:
  refreshInterval: "1h"
  secretStoreRef: { name: gshare-vault, kind: SecretStore }
  target: { name: gshare-auth-token, creationPolicy: Owner }
  data:
    - secretKey: secret
      remoteRef: { key: auth/user-token, property: hs256_secret }
---
# 2. Bootstrap kubeconfigs: the credentials for remote clusters, held KMS-encrypted. Rotated as
#    24-hour TokenRequests.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gshare-cluster-kubeconfig
  namespace: gshare-system
spec:
  refreshInterval: "1h"
  secretStoreRef: { name: gshare-vault, kind: SecretStore }
  target: { name: gshare-cluster-kubeconfig, creationPolicy: Owner }
  data:
    - secretKey: kubeconfig
      remoteRef: { key: clusters/fake-lab, property: kubeconfig }
---
# 3. cosign signing and verification keys for the supply chain. Keyless OIDC is preferred; with a
#    key, rotate every 180 days.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cosign-key
  namespace: gshare-system
spec:
  refreshInterval: "6h"
  secretStoreRef: { name: gshare-vault, kind: SecretStore }
  target: { name: cosign-key, creationPolicy: Owner }
  data:
    - secretKey: cosign.pub
      remoteRef: { key: supplychain/cosign, property: public_key }
    - secretKey: cosign.key
      remoteRef: { key: supplychain/cosign, property: private_key }
---
# 4. Registry pull and push credentials for Harbor (registry.gshare.internal), in imagePullSecret
#    form. Rotate every 90 days.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gshare-registry
  namespace: gshare-system
spec:
  refreshInterval: "1h"
  secretStoreRef: { name: gshare-vault, kind: SecretStore }
  target:
    name: gshare-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef: { key: registry/harbor, property: dockerconfigjson }
---
# 5. Object store credentials for the WORM audit export and the Postgres barman backups, against
#    MinIO or Ceph RGW. Rotate every 90 days.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pg-backup-s3
  namespace: gshare-system
spec:
  refreshInterval: "1h"
  secretStoreRef: { name: gshare-vault, kind: SecretStore }
  target: { name: pg-backup-s3, creationPolicy: Owner }
  data:
    - secretKey: ACCESS_KEY
      remoteRef: { key: objectstore/s3, property: access_key }
    - secretKey: SECRET_KEY
      remoteRef: { key: objectstore/s3, property: secret_key }
