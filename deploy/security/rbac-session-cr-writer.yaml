# Role granting writes to gshare.io/gsharesessions, for the Python control plane's CRD-primary
# handoff. Namespace-scoped least privilege; status is read-only, because the ledger is written back
# by the status callback.
#
# A standalone equivalent of the chart's operator-rbac.yaml, for applying to an external cluster or
# for review.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gshare-session-cr-writer
  namespace: gshare-sessions
rules:
  - apiGroups: ["gshare.io"]
    resources: ["gsharesessions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gshare.io"]
    resources: ["gsharesessions/status"]
    verbs: ["get"]                          # read status only
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gshare-session-cr-writer
  namespace: gshare-sessions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gshare-session-cr-writer
subjects:
  - kind: ServiceAccount
    name: gshare-controller
    namespace: gshare-system
