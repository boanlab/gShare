# app-ckpt disk bandwidth (E1b): 6GB direct-I/O write+read on the node's ephemeral storage.
# Grounds the disk-checkpoint I/O cost (write ~155 MB/s, read ~2.6 GB/s on gpu2-1).
apiVersion: v1
kind: Pod
metadata: {name: e2e-disk, namespace: default, labels: {app: e2e}}
spec:
  restartPolicy: Never
  nodeSelector: {kubernetes.io/hostname: gpu2-1}
  containers:
  - name: d
    image: docker.io/boanlab/gshare-e2e-workload:latest
    command: ["bash","-c","cd /scratch; echo WRITE:; dd if=/dev/zero of=ckpt.bin bs=1M count=6144 oflag=direct 2>&1 | tail -1; echo READ:; dd if=ckpt.bin of=/dev/null bs=1M iflag=direct 2>&1 | tail -1; rm -f ckpt.bin"]
    volumeMounts: [{name: scratch, mountPath: /scratch}]
  volumes: [{name: scratch, emptyDir: {}}]
