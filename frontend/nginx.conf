# Serves the SPA at the root — the user console at / and the admin console at /admin — and proxies
# REST calls under /api/v1.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SSE session events. Buffering is disabled, and this must match before the static fallback.
  location ~ ^/api/v1/sessions/.+/events$ {
    proxy_pass http://gshare-api:8080;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    # Preserve the original scheme, host, and client IP from the TLS-terminating proxy in front.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # REST API proxy; the bearer header passes straight through.
  location /api/ {
    proxy_pass http://gshare-api:8080;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Project-Id $http_x_project_id;
    # Preserve the original scheme, host, and client IP from the TLS-terminating proxy in front.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Optional, Compose only: relay /proxy/ session traffic to an external GPU cluster's ingress.
  # When GSHARE_SESSION_INGRESS is set, the entrypoint hook (30-session-proxy.sh) writes a
  # `location /proxy/` block here. On an all-in-one Kubernetes install it is unset, this include is
  # empty, and the cluster ingress handles /proxy/ itself.
  include /etc/nginx/session-proxy/*.conf;

  # Hashed assets are immutable; index.html must NEVER be cached, or browsers keep booting an old
  # bundle long after a deploy (stale UI reports came from exactly this).
  location = /index.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: both the user console (/) and the admin console (/admin/*) resolve to index.html,
  # and React Router takes it from there.
  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
