  verbs:
  - get
  - patch
  - update
- apiGroups:
  - gshare.io
  resources:
  - gsharesessions
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gshare.io
  resources:
  - gsharesessions/finalizers
  verbs:
  - update
- apiGroups:
  - gshare.io
  resources:
  - gsharesessions/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
