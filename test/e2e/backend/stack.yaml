# The lightweight backend stack — api, worker, Postgres, Redis — for exercising the API, credits, and
# the queue.
# deploy.sh rewrites docker.io/boanlab/gshare-backend:latest to ${REGISTRY}/${ORG}/…:${TAG}.
# api and worker run the same image with different commands, are not pinned to a node, and read
# GSHARE_-prefixed environment variables.
---
apiVersion: v1
kind: Namespace
metadata: { name: gshare-system }
---
# The service account and RBAC the api uses for the in-cluster handoff. Without a
# kubeconfig_secret_ref, crd.py falls back to this service account and applies gshare.io/v1
# gsharesessions into the gshare-sessions namespace.
apiVersion: v1
kind: ServiceAccount
metadata: { name: gshare-api, namespace: gshare-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: gshare-api }
rules:
  - apiGroups: ["gshare.io"]
    resources: ["gsharesessions", "gsharesessions/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: gshare-api }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: gshare-api }
subjects:
  - { kind: ServiceAccount, name: gshare-api, namespace: gshare-system }
---
# ── PostgreSQL; the PVC is provisioned by the default StorageClass, local-path ──
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: gshare-pg-data, namespace: gshare-system }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gshare-pg, namespace: gshare-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: gshare-pg } }
  template:
    metadata: { labels: { app: gshare-pg } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_USER, value: gshare }
            - { name: POSTGRES_PASSWORD, value: gshare }
            - { name: POSTGRES_DB, value: gshare }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [ { containerPort: 5432 } ]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "gshare"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts: [ { name: data, mountPath: /var/lib/postgresql/data } ]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gshare-pg-data }
---
apiVersion: v1
kind: Service
metadata: { name: gshare-pg-rw, namespace: gshare-system }
spec:
  selector: { app: gshare-pg }
  ports: [ { port: 5432, targetPort: 5432 } ]
---
# ── Redis ──
apiVersion: apps/v1
kind: Deployment
metadata: { name: gshare-redis, namespace: gshare-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: gshare-redis } }
  template:
    metadata: { labels: { app: gshare-redis } }
    spec:
      containers:
        - name: redis
          image: redis:7
          ports: [ { containerPort: 6379 } ]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: gshare-redis, namespace: gshare-system }
spec:
  selector: { app: gshare-redis }
  ports: [ { port: 6379, targetPort: 6379 } ]
---
# ── gshare-api: an initContainer runs the alembic migration, then uvicorn starts ──
apiVersion: apps/v1
kind: Deployment
metadata: { name: gshare-api, namespace: gshare-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: gshare-api } }
  template:
    metadata: { labels: { app: gshare-api } }
    spec:
      serviceAccountName: gshare-api
      initContainers:
        - name: migrate
          image: docker.io/boanlab/gshare-backend:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              python - <<'PY'
              import socket, time
              while True:
                  try:
                      socket.create_connection(("gshare-pg-rw", 5432), 2).close(); break
                  except OSError:
                      print("wait-pg"); time.sleep(2)
              PY
              alembic upgrade head
          env: &beenv
            - { name: GSHARE_DATABASE_URL, value: "postgresql+asyncpg://gshare:gshare@gshare-pg-rw:5432/gshare" }
            - { name: GSHARE_REDIS_URL, value: "redis://gshare-redis:6379/0" }
            - { name: GSHARE_AUTH_ALLOW_LOCAL_PASSWORD, value: "true" }
            # HS256 signing key for user tokens. There is no default in code, so the api refuses to
            # start without it. This is the value the e2e scripts sign with.
            - { name: GSHARE_USER_JWT_SECRET, value: "gshare-dev-secret" }
            # Path-based session routing: connect URLs are {domain}/proxy/{cr}/... This has to match
            # the operator's --session-domain. Tests use plain http.
            - { name: GSHARE_SESSION_DOMAIN, value: "gshare.example.com" }
            - { name: GSHARE_SESSION_URL_SCHEME, value: "http" }
            - { name: GSHARE_BILLING_INTERVAL_SEC, value: "2" }
            - { name: GSHARE_IDLE_TIMEOUT_SEC, value: "1800" }  # stamped onto the CR as the reaper's idle window
            # The internal plane's RS256 JWT. The api both signs and verifies it and publishes its own
            # JWKS, which is how the operator's /internal callbacks are checked.
            - { name: GSHARE_INTERNAL_JWT_KID, value: "internal" }
            - { name: GSHARE_INTERNAL_JWKS_URL, value: "http://gshare-api.gshare-system.svc/.well-known/gshare-internal-jwks.json" }
            - name: GSHARE_INTERNAL_JWT_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: gshare-jwt-signing, key: private.pem } }
      containers:
        - name: api
          image: docker.io/boanlab/gshare-backend:latest
          imagePullPolicy: Always
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          env: *beenv
          ports: [ { containerPort: 8000, name: http } ]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: gshare-api, namespace: gshare-system }
spec:
  selector: { app: gshare-api }
  # 80 serves the internal traffic (operator callbacks and registration); 8080 is the port the
  # frontend's nginx.conf proxy_pass expects.
  ports:
    - { port: 80, targetPort: http, name: http }
    - { port: 8080, targetPort: http, name: http-alt }
---
# ── gshare-worker: the batch loops for billing, budgets, tokens, and the queue ──
apiVersion: apps/v1
kind: Deployment
metadata: { name: gshare-worker, namespace: gshare-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: gshare-worker } }
  template:
    metadata: { labels: { app: gshare-worker } }
    spec:
      # A queue_ticker dequeue calls handoff.apply_desired, which applies a GShareSession, so the
      # worker needs the same gsharesessions RBAC as the api (service account gshare-api). Without it,
      # dequeuing fails with 403.
      serviceAccountName: gshare-api
      containers:
        - name: worker
          image: docker.io/boanlab/gshare-backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.workers.runner"]
          env:
            - { name: GSHARE_DATABASE_URL, value: "postgresql+asyncpg://gshare:gshare@gshare-pg-rw:5432/gshare" }
            - { name: GSHARE_REDIS_URL, value: "redis://gshare-redis:6379/0" }
            - { name: GSHARE_AUTH_ALLOW_LOCAL_PASSWORD, value: "true" }
            - { name: GSHARE_USER_JWT_SECRET, value: "gshare-dev-secret" }
            - { name: GSHARE_BILLING_INTERVAL_SEC, value: "2" }
            - { name: GSHARE_IDLE_TIMEOUT_SEC, value: "1800" }  # stamped onto the CR as the reaper's idle window
